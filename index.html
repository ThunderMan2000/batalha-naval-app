<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚔️ Batalha Naval da Vida</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a1a;
            font-family: Arial, sans-serif;
            color: white;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #app {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* CABEÇALHO */
        .header {
            text-align: center;
            padding: 15px 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid #ffd700;
        }
        
        .header h1 {
            font-size: 22px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .header p {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        
        /* TIMER */
        .timer-container {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            border: 2px solid #e94560;
        }
        
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        .timer.warning {
            color: #e94560;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .timer-info {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .timer-info span {
            color: #ffd700;
            font-weight: bold;
        }
        
        /* PLACAR */
        .placar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            background: #1a1a2e;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid #333;
        }
        
        .jogador-info {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .jogador-info.ativo {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #ffd700;
        }
        
        .jogador-info h3 {
            font-size: 14px;
            color: #e0e0e0;
        }
        
        .jogador-info .pontos {
            font-size: 28px;
            color: #4ecdc4;
            font-weight: bold;
        }
        
        .jogador-info .turno-indicador {
            font-size: 11px;
            color: #ffd700;
        }
        
        .jogador-info .posicoes {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        
        .vs-div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #e94560;
            padding: 0 10px;
        }
        
        /* TABULEIROS */
        .tabuleiros {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .tabuleiro-container {
            background: #16213e;
            padding: 10px;
            border-radius: 12px;
            border: 3px solid #333;
            transition: all 0.3s;
        }
        
        .tabuleiro-container.posicionamento {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            cursor: pointer;
        }
        
        .tabuleiro-container.posicionamento:hover {
            transform: scale(1.02);
        }
        
        .tabuleiro-container.defesa-ativa {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        .tabuleiro-container h4 {
            text-align: center;
            font-size: 12px;
            color: #e0e0e0;
            margin-bottom: 8px;
        }
        
        .tabuleiro-container .contador {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 30px repeat(7, 1fr);
            gap: 3px;
            justify-content: center;
        }
        
        .grid-header {
            background: #e94560;
            color: white;
            padding: 4px 2px;
            border-radius: 4px;
            font-size: 7px;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .grid-row-header {
            background: #0f3460;
            color: #e0e0e0;
            padding: 2px;
            border-radius: 4px;
            font-size: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-all;
            line-height: 1.1;
        }
        
        .cell {
            aspect-ratio: 1;
            background: #1a1a40;
            border-radius: 4px;
            border: 1px solid #0f3460;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            min-height: 30px;
        }
        
        .cell:active {
            transform: scale(0.92);
        }
        
        .cell.posicionamento {
            cursor: pointer;
            border-color: #555;
        }
        
        .cell.posicionamento:hover {
            background: #2a2a5a;
            border-color: #ffd700;
        }
        
        .cell.posicionamento.selecionado {
            background: #e94560;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
        
        .cell.revelado-acerto {
            background: #00d2ff;
            border-color: #00d2ff;
        }
        
        .cell.revelado-erro {
            background: #2d2d44;
            border-color: #2d2d44;
        }
        
        .cell.escondido {
            background: #1a1a40;
        }
        
        .cell.escondido:hover {
            background: #2a2a5a;
        }
        
        .cell.ativo {
            border-color: #e94560;
        }
        
        /* BOTÕES */
        .botoes {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            flex: 1;
            min-width: 120px;
            max-width: 200px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary {
            background: #e94560;
            color: white;
        }
        
        .btn-primary:hover {
            background: #c73652;
        }
        
        .btn-secondary {
            background: #0f3460;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #1a4a8a;
        }
        
        .btn-gold {
            background: #ffd700;
            color: #0a0a1a;
        }
        
        .btn-gold:hover {
            background: #e6c200;
        }
        
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        
        .btn-success:hover {
            background: #27ae60;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        /* ALERTA PERSONALIZADO */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s;
        }
        
        .modal-overlay.ativo {
            display: flex;
        }
        
        .modal {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 2px solid #ffd700;
            animation: slideUp 0.3s;
        }
        
        .modal h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .modal p {
            color: #ccc;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .modal .btn {
            width: 100%;
            max-width: 100%;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* RESPONSIVO */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 22px repeat(7, 1fr);
                gap: 2px;
            }
            
            .grid-header {
                font-size: 5px;
                padding: 2px 1px;
            }
            
            .grid-row-header {
                font-size: 5px;
                padding: 1px;
            }
            
            .cell {
                font-size: 10px;
                min-height: 22px;
            }
            
            .header h1 {
                font-size: 17px;
            }
            
            .jogador-info .pontos {
                font-size: 20px;
            }
            
            .tabuleiro-container {
                padding: 6px;
            }
            
            .tabuleiros {
                gap: 6px;
            }
            
            .timer {
                font-size: 32px;
            }
        }
        
        @media (max-width: 400px) {
            .grid {
                grid-template-columns: 18px repeat(7, 1fr);
                gap: 1.5px;
            }
            
            .grid-header {
                font-size: 4px;
                padding: 1px;
            }
            
            .grid-row-header {
                font-size: 4px;
            }
            
            .cell {
                font-size: 8px;
                min-height: 18px;
                border-radius: 2px;
            }
            
            .timer {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- MODAL DE ALERTA -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">🎯</h2>
            <p id="modal-message">Mensagem</p>
            <button class="btn btn-gold" onclick="fecharModal()">OK</button>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO =====
        const colunas = ['Fin', 'Sau', 'Soc', 'Men', 'Tra', 'Fam', 'Esp'];
        const colunasCompletas = ['💰 Finanças', '❤️ Saúde', '👥 Social', '🧠 Mental', '💼 Trabalho', '🏠 Família', '🌱 Espírito'];
        const linhas = ['Dívidas', 'Doença', 'Solidão', 'Ansiedade', 'Estagnação', 'Conflitos', 'Propósito'];

        // ===== ESTADO DO JOGO =====
        let estado = {
            fase: 'posicionamento', // 'posicionamento' ou 'duelo'
            jogadorAtualPosicionamento: 1, // 1 ou 2
            timer: 30,
            timerInterval: null,
            jogador1: {
                nome: 'Jogador 1',
                tabuleiro: [],
                pontos: 0,
                turno: false,
                problemasColocados: 0,
                maxProblemas: 10
            },
            jogador2: {
                nome: 'Jogador 2',
                tabuleiro: [],
                pontos: 0,
                turno: false,
                problemasColocados: 0,
                maxProblemas: 10
            },
            turnoAtual: 1,
            jogoAtivo: true,
            vencedor: null,
            posicionamentoFinalizado: false
        };

        // ===== CRIA TABULEIRO VAZIO =====
        function criarTabuleiroVazio(jogador) {
            const tab = [];
            for (let l = 0; l < 7; l++) {
                const linha = [];
                for (let c = 0; c < 7; c++) {
                    linha.push({
                        coluna: colunasCompletas[c],
                        linha: linhas[l],
                        problema: null,
                        ativo: false,
                        revelado: false,
                        dono: jogador
                    });
                }
                tab.push(linha);
            }
            return tab;
        }

        // ===== INICIALIZA JOGO =====
        function iniciarJogo() {
            estado.jogador1.tabuleiro = criarTabuleiroVazio('Jogador 1');
            estado.jogador2.tabuleiro = criarTabuleiroVazio('Jogador 2');
            estado.jogador1.pontos = 0;
            estado.jogador2.pontos = 0;
            estado.jogador1.problemasColocados = 0;
            estado.jogador2.problemasColocados = 0;
            estado.jogador1.turno = false;
            estado.jogador2.turno = false;
            estado.turnoAtual = 1;
            estado.jogoAtivo = true;
            estado.vencedor = null;
            estado.fase = 'posicionamento';
            estado.jogadorAtualPosicionamento = 1;
            estado.timer = 30;
            estado.posicionamentoFinalizado = false;
            
            if (estado.timerInterval) {
                clearInterval(estado.timerInterval);
                estado.timerInterval = null;
            }
            
            renderizar();
            iniciarTimer();
        }

        // ===== TIMER =====
        function iniciarTimer() {
            if (estado.timerInterval) {
                clearInterval(estado.timerInterval);
            }
            
            estado.timer = 30;
            
            estado.timerInterval = setInterval(() => {
                estado.timer--;
                renderizarTimer();
                
                if (estado.timer <= 0) {
                    clearInterval(estado.timerInterval);
                    estado.timerInterval = null;
                    finalizarPosicionamento();
                }
            }, 1000);
        }

        function renderizarTimer() {
            const timerEl = document.getElementById('timer');
            const timerInfoEl = document.getElementById('timer-info');
            
            if (timerEl) {
                timerEl.textContent = `${estado.timer}s`;
                if (estado.timer <= 5) {
                    timerEl.classList.add('warning');
                } else {
                    timerEl.classList.remove('warning');
                }
            }
            
            if (timerInfoEl) {
                const jogador = estado.jogadorAtualPosicionamento === 1 ? estado.jogador1 : estado.jogador2;
                timerInfoEl.innerHTML = `⏳ <span>${jogador.nome}</span> está posicionando seus problemas (${jogador.problemasColocados}/${jogador.maxProblemas})`;
            }
        }

        // ===== FINALIZAR POSICIONAMENTO =====
        function finalizarPosicionamento() {
            if (estado.posicionamentoFinalizado) return;
            
            // Verifica se o jogador atual colocou pelo menos 1 problema
            const jogador = estado.jogadorAtualPosicionamento === 1 ? estado.jogador1 : estado.jogador2;
            
            if (jogador.problemasColocados === 0) {
                // Se não colocou nenhum, coloca 10 aleatórios
                colocarProblemasAleatorios(jogador);
            }
            
            // Passa para o próximo jogador ou inicia o duelo
            if (estado.jogadorAtualPosicionamento === 1) {
                estado.jogadorAtualPosicionamento = 2;
                estado.timer = 30;
                renderizar();
                iniciarTimer();
                mostrarAlerta('🔄', `Agora é a vez do ${estado.jogador2.nome} posicionar seus problemas!`);
            } else {
                // Fim do posicionamento, inicia duelo
                estado.posicionamentoFinalizado = true;
                estado.fase = 'duelo';
                estado.turnoAtual = 1;
                estado.jogador1.turno = true;
                estado.jogador2.turno = false;
                
                if (estado.timerInterval) {
                    clearInterval(estado.timerInterval);
                    estado.timerInterval = null;
                }
                
                renderizar();
                mostrarAlerta('⚔️', 'Posicionamento finalizado! O duelo vai começar!');
            }
        }

        // ===== COLOCAR PROBLEMAS ALEATÓRIOS =====
        function colocarProblemasAleatorios(jogador) {
            let colocados = 0;
            const maxTentativas = 100;
            let tentativas = 0;
            
            while (colocados < jogador.maxProblemas && tentativas < maxTentativas) {
                tentativas++;
                const l = Math.floor(Math.random() * 7);
                const c = Math.floor(Math.random() * 7);
                
                if (!jogador.tabuleiro[l][c].ativo) {
                    jogador.tabuleiro[l][c].ativo = true;
                    jogador.tabuleiro[l][c].problema = `${linhas[l]} em ${colunasCompletas[c]}`;
                    colocados++;
                    jogador.problemasColocados = colocados;
                }
            }
        }

        // ===== POSICIONAR PROBLEMA (CLIQUE NA FASE DE POSICIONAMENTO) =====
        function posicionarProblema(jogadorNum, linha, coluna) {
            if (estado.fase !== 'posicionamento') return;
            if (estado.jogadorAtualPosicionamento !== jogadorNum) return;
            
            const jogador = jogadorNum === 1 ? estado.jogador1 : estado.jogador2;
            const celula = jogador.tabuleiro[linha][coluna];
            
            if (celula.ativo) {
                // Remove o problema
                celula.ativo = false;
                celula.problema = null;
                jogador.problemasColocados--;
            } else if (jogador.problemasColocados < jogador.maxProblemas) {
                // Adiciona o problema
                celula.ativo = true;
                celula.problema = `${linhas[linha]} em ${colunasCompletas[coluna]}`;
                jogador.problemasColocados++;
            } else {
                mostrarAlerta('⚠️', `Você já colocou ${jogador.maxProblemas} problemas!`);
                return;
            }
            
            renderizar();
        }

        // ===== AÇÃO DE ATAQUE (DUELO) =====
        function atacar(jogadorAtacanteNum, linha, coluna) {
            if (estado.fase !== 'duelo') return;
            if (!estado.jogoAtivo) {
                mostrarAlerta('🏁', 'O jogo já acabou! Clique em "Novo Duelo" para recomeçar.');
                return;
            }
            if (jogadorAtacanteNum !== estado.turnoAtual) {
                mostrarAlerta('⏳', `Aguarde! É a vez do Jogador ${estado.turnoAtual}`);
                return;
            }

            const defensorNum = jogadorAtacanteNum === 1 ? 2 : 1;
            const defensor = defensorNum === 1 ? estado.jogador1 : estado.jogador2;
            const atacante = jogadorAtacanteNum === 1 ? estado.jogador1 : estado.jogador2;
            
            const celula = defensor.tabuleiro[linha][coluna];
            
            if (celula.revelado) {
                mostrarAlerta('⏳', 'Essa posição já foi atacada!');
                return;
            }

            celula.revelado = true;
            
            if (celula.ativo) {
                atacante.pontos += 10;
                mostrarAlerta('🎯 ACERTOU!', `${atacante.nome} resolveu: ${celula.problema}`);
                
                // Verifica se o defensor perdeu todos os problemas
                const todosRevelados = defensor.tabuleiro.every(lin => 
                    lin.every(cel => !cel.ativo || cel.revelado)
                );
                
                if (todosRevelados) {
                    estado.jogoAtivo = false;
                    estado.vencedor = atacante.nome;
                    mostrarAlerta('🏆 VITÓRIA!', `${atacante.nome} VENCEU O DUELO!`);
                }
            } else {
                mostrarAlerta('💨 ÁGUA!', `${atacante.nome} errou o alvo.`);
            }
            
            // Alterna turno
            if (estado.jogoAtivo) {
                estado.turnoAtual = estado.turnoAtual === 1 ? 2 : 1;
                estado.jogador1.turno = estado.turnoAtual === 1;
                estado.jogador2.turno = estado.turnoAtual === 2;
            }
            
            renderizar();
        }

        // ===== MOSTRA ALERTA =====
        function mostrarAlerta(titulo, mensagem) {
            document.getElementById('modal-title').textContent = titulo;
            document.getElementById('modal-message').textContent = mensagem;
            document.getElementById('modal').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modal').classList.remove('ativo');
        }

        // ===== RENDERIZA O JOGO =====
        function renderizar() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            // CABEÇALHO
            const header = document.createElement('div');
            header.className = 'header';
            const faseTexto = estado.fase === 'posicionamento' ? '📍 Posicionamento' : '⚔️ Duelo';
            header.innerHTML = `
                <h1>⚔️ Batalha Naval da Vida</h1>
                <p>${faseTexto} - ${estado.fase === 'posicionamento' ? 'Coloque seus problemas!' : 'Resolva os problemas do oponente!'}</p>
            `;
            app.appendChild(header);

            // TIMER (só na fase de posicionamento)
            if (estado.fase === 'posicionamento') {
                const timerContainer = document.createElement('div');
                timerContainer.className = 'timer-container';
                timerContainer.innerHTML = `
                    <div class="timer" id="timer">${estado.timer}s</div>
                    <div class="timer-info" id="timer-info">
                        ⏳ <span>${estado.jogadorAtualPosicionamento === 1 ? estado.jogador1.nome : estado.jogador2.nome}</span> 
                        está posicionando (${estado.jogadorAtualPosicionamento === 1 ? estado.jogador1.problemasColocados : estado.jogador2.problemasColocados}/10)
                    </div>
                `;
                app.appendChild(timerContainer);
            }

            // PLACAR
            const placar = document.createElement('div');
            placar.className = 'placar';
            
            const j1Ativo = estado.fase === 'duelo' && estado.jogador1.turno;
            const j2Ativo = estado.fase === 'duelo' && estado.jogador2.turno;
            
            placar.innerHTML = `
                <div class="jogador-info ${j1Ativo ? 'ativo' : ''}">
                    <h3>${estado.jogador1.nome}</h3>
                    <div class="pontos">⭐ ${estado.jogador1.pontos}</div>
                    ${j1Ativo ? '<div class="turno-indicador">👈 ATUAL</div>' : ''}
                    ${estado.fase === 'posicionamento' && estado.jogadorAtualPosicionamento === 1 ? '<div class="turno-indicador" style="color:#ffd700">📍 POSICIONANDO</div>' : ''}
                    <div class="posicoes">${estado.jogador1.problemasColocados}/10 problemas</div>
                </div>
                <div class="vs-div">⚔️</div>
                <div class="jogador-info ${j2Ativo ? 'ativo' : ''}">
                    <h3>${estado.jogador2.nome}</h3>
                    <div class="pontos">⭐ ${estado.jogador2.pontos}</div>
                    ${j2Ativo ? '<div class="turno-indicador">👈 ATUAL</div>' : ''}
                    ${estado.fase === 'posicionamento' && estado.jogadorAtualPosicionamento === 2 ? '<div class="turno-indicador" style="color:#ffd700">📍 POSICIONANDO</div>' : ''}
                    <div class="posicoes">${estado.jogador2.problemasColocados}/10 problemas</div>
                </div>
            `;
            app.appendChild(placar);

            // TABULEIROS
            const tabuleiros = document.createElement('div');
            tabuleiros.className = 'tabuleiros';
            
            const tab1 = criarTabuleiroVisual(estado.jogador1, 1);
            tabuleiros.appendChild(tab1);
            
            const tab2 = criarTabuleiroVisual(estado.jogador2, 2);
            tabuleiros.appendChild(tab2);
            
            app.appendChild(tabuleiros);

            // BOTÕES
            const botoes = document.createElement('div');
            botoes.className = 'botoes';
            
            let botoesHTML = `
                <button class="btn btn-primary" onclick="reiniciarJogo()">🔄 Novo Duelo</button>
                <button class="btn btn-secondary" onclick="mostrarRegras()">📖 Regras</button>
            `;
            
            if (estado.fase === 'posicionamento') {
                botoesHTML += `<button class="btn btn-success" onclick="finalizarPosicionamento()">⏭️ Avançar</button>`;
            }
            
            botoes.innerHTML = botoesHTML;
            app.appendChild(botoes);
        }

        // ===== CRIA TABULEIRO VISUAL =====
        function criarTabuleiroVisual(jogador, numero) {
            const container = document.createElement('div');
            container.className = 'tabuleiro-container';
            
            const isPosicionamento = estado.fase === 'posicionamento';
            const isJogadorAtual = numero === estado.jogadorAtualPosicionamento;
            
            if (isPosicionamento && isJogadorAtual) {
                container.classList.add('posicionamento');
            }
            
            if (estado.fase === 'duelo') {
                const defensorNum = estado.turnoAtual === 1 ? 2 : 1;
                if (numero === defensorNum && estado.jogoAtivo) {
                    container.classList.add('defesa-ativa');
                }
            }
            
            container.innerHTML = `<h4>🎯 ${jogador.nome}</h4>`;
            
            const grid = document.createElement('div');
            grid.className = 'grid';

            // Cabeçalho
            const emptyHeader = document.createElement('div');
            emptyHeader.className = 'grid-header';
            emptyHeader.style.background = 'transparent';
            emptyHeader.style.border = 'none';
            grid.appendChild(emptyHeader);

            colunas.forEach(col => {
                const header = document.createElement('div');
                header.className = 'grid-header';
                header.textContent = col;
                grid.appendChild(header);
            });

            // Linhas
            for (let l = 0; l < 7; l++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'grid-row-header';
                rowHeader.textContent = linhas[l];
                grid.appendChild(rowHeader);

                for (let c = 0; c < 7; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const celula = jogador.tabuleiro[l][c];
                    
                    // Fase de posicionamento
                    if (estado.fase === 'posicionamento') {
                        if (isJogadorAtual) {
                            cell.classList.add('posicionamento');
                            if (celula.ativo) {
                                cell.classList.add('selecionado');
                                cell.textContent = '⚔️';
                            } else {
                                cell.textContent = '⬜';
                            }
                            
                            cell.onclick = () => {
                                posicionarProblema(numero, l, c);
                            };
                            
                            cell.ontouchstart = (e) => {
                                e.preventDefault();
                                posicionarProblema(numero, l, c);
                            };
                        } else {
                            // Tabuleiro do oponente - escondido
                            cell.textContent = '❓';
                            cell.style.cursor = 'default';
                        }
                    } else {
                        // Fase de duelo
                        if (celula.revelado) {
                            if (celula.ativo) {
                                cell.classList.add('revelado-acerto');
                                cell.textContent = '✅';
                            } else {
                                cell.classList.add('revelado-erro');
                                cell.textContent = '💨';
                            }
                        } else {
                            cell.classList.add('escondido');
                            cell.textContent = '❓';
                        }
                        
                        // Só permite atacar se for o tabuleiro do oponente
                        const atacanteNum = estado.turnoAtual;
                        if (atacanteNum !== numero && estado.fase === 'duelo') {
                            cell.onclick = () => {
                                atacar(atacanteNum, l, c);
                            };
                            cell.ontouchstart = (e) => {
                                e.preventDefault();
                                atacar(atacanteNum, l, c);
                            };
                        } else {
                            cell.style.cursor = 'default';
                        }
                    }
                    
                    grid.appendChild(cell);
                }
            }

            container.appendChild(grid);
            
            // Contador de problemas
            const contador = document.createElement('div');
            contador.className = 'contador';
            if (estado.fase === 'posicionamento') {
                contador.textContent = `${jogador.problemasColocados}/10 problemas colocados`;
            } else {
                const total = jogador.tabuleiro.flat().filter(c => c.ativo).length;
                const revelados = jogador.tabuleiro.flat().filter(c => c.ativo && c.revelado).length;
                contador.textContent = `Problemas revelados: ${revelados}/${total}`;
            }
            container.appendChild(contador);
            
            return container;
        }

        // ===== REINICIAR JOGO =====
        function reiniciarJogo() {
            if (confirm('Deseja realmente reiniciar o jogo?')) {
                if (estado.timerInterval) {
                    clearInterval(estado.timerInterval);
                    estado.timerInterval = null;
                }
                iniciarJogo();
            }
        }

        // ===== MOSTRAR REGRAS =====
        function mostrarRegras() {
            mostrarAlerta('📖 REGRAS', 
                '📍 FASE DE POSICIONAMENTO (30s):\n' +
                'Cada jogador coloca 10 problemas no próprio tabuleiro\n\n' +
                '⚔️ FASE DE DUELO:\n' +
                'Alternem turnos para atacar o oponente\n' +
                '✅ Acertou um problema? +10 pontos!\n' +
                '💨 Errou? Perde a vez!\n' +
                '🏆 Quem resolver todos os problemas do oponente VENCE!'
            );
        }

        // ===== INICIA O JOGO =====
        iniciarJogo();
        
        // ===== REGISTRA SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('📱 App instalável!'))
                .catch(() => console.log('⚠️ Service Worker não registrado'));
        }
    </script>
</body>
</html>
